services:
  model:                      # AI model API (built from model/Dockerfile)
    build: ./model
    ports: ["5000:5000"]
    depends_on: [db]
  db:                         # PostgreSQL database
    image: postgres:16
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: aidb
    volumes: [dbdata:/var/lib/postgresql/data]   # data survives restarts
  frontend:                   # static web page served by nginx
    image: nginx:alpine
    ports: ["3000:80"]
    volumes: ["./frontend:/usr/share/nginx/html:ro"]
    depends_on: [model]
volumes:
  dbdata:
