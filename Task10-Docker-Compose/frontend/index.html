<!DOCTYPE html>
<html>
<head><title>Iris Predictor</title></head>
<body>
  <h2>Iris Flower Predictor</h2>
  <p>Enter 4 measurements (comma separated):</p>
  <input id="f" value="5.1,3.5,1.4,0.2">
  <button onclick="predict()">Predict</button>
  <h3 id="out"></h3>
  <script>
    async function predict() {
      const features = document.getElementById("f").value.split(",").map(Number);
      const res = await fetch("http://localhost:5000/predict", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({features})
      });
      const data = await res.json();
      document.getElementById("out").textContent = "Species: " + data.species;
    }
  </script>
</body>
</html>
